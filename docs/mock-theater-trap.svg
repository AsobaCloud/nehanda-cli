<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .font-sans { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .title { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #455bf1; }
      .heading { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .subtext { font-size: 13px; fill: #94a3b8; }
      .badge { font-size: 11px; font-weight: 600; }
    </style>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#455bf1" />
      <stop offset="100%" stop-color="#2a3cc7" />
    </linearGradient>

    <marker id="arrow-primary" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455bf1" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Frame -->
  <rect width="860" height="380" rx="14" fill="#0b0d14" stroke="#22283e" stroke-width="1.5" />

  <!-- Header Section -->
  <rect x="24" y="20" width="10" height="10" rx="3" fill="#455bf1" />
  <text x="44" y="29" class="font-sans title">ANTI-PATTERN IN AUTONOMOUS CODING</text>
  <text x="24" y="60" class="font-sans heading">The Mock Theater Trap: Software Engineering as Plausible Fiction</text>
  <line x1="24" y1="78" x2="836" y2="78" stroke="#1c2237" stroke-width="1" />

  <!-- Step 1: Model generates code -->
  <rect x="50" y="110" width="310" height="90" rx="10" fill="#121626" stroke="#293254" stroke-width="1.5" />
  <rect x="68" y="124" width="24" height="24" rx="6" fill="#455bf1" fill-opacity="0.15" />
  <text x="80" y="141" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#455bf1">1</text>
  <text x="102" y="141" class="font-sans heading" font-size="15">Model Generates Code</text>
  <text x="68" y="174" class="font-sans subtext">Produces 300+ lines of implementation,</text>
  <text x="68" y="191" class="font-sans subtext">often embedding implicit architectural flaws.</text>

  <!-- Flow 1 -> 2 -->
  <path d="M 360 155 L 490 155" stroke="#455bf1" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="425" y="144" text-anchor="middle" class="font-sans badge" fill="#818cf8">User asks: "Did you test?"</text>

  <!-- Step 2: Model inspects own code -->
  <rect x="500" y="110" width="310" height="90" rx="10" fill="#121626" stroke="#293254" stroke-width="1.5" />
  <rect x="518" y="124" width="24" height="24" rx="6" fill="#455bf1" fill-opacity="0.15" />
  <text x="530" y="141" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#455bf1">2</text>
  <text x="552" y="141" class="font-sans heading" font-size="15">Inspects Own Implementation</text>
  <text x="518" y="174" class="font-sans subtext">Derives unit test cases strictly by mirroring</text>
  <text x="518" y="191" class="font-sans subtext">its own freshly generated logic paths.</text>

  <!-- Flow 2 -> 3 -->
  <path d="M 655 200 L 655 240" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-danger)" />

  <!-- Step 3: Self-Mocking Trap -->
  <rect x="500" y="250" width="310" height="95" rx="10" fill="#1c141d" stroke="#ef4444" stroke-width="1.5" />
  <rect x="518" y="264" width="24" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" />
  <text x="530" y="281" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#ef4444">3</text>
  <text x="552" y="281" class="font-sans heading" font-size="15" fill="#fca5a5">Mocks Own Assumptions</text>
  <text x="518" y="312" class="font-sans subtext" fill="#fecaca">Stubs external APIs with identical responses.</text>
  <text x="518" y="330" class="font-sans font-mono" font-size="12" fill="#f87171">assert fn(x) == expected_mock (100% pass)</text>

  <!-- Flow 3 -> 4 (Loop back) -->
  <path d="M 500 297 L 370 297" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-danger)" />
  <text x="435" y="287" text-anchor="middle" class="font-sans badge" fill="#f87171">Zero live verification</text>

  <!-- Step 4: The False Illusion -->
  <rect x="50" y="250" width="310" height="95" rx="10" fill="#171221" stroke="#a855f7" stroke-width="1.5" />
  <rect x="68" y="264" width="24" height="24" rx="6" fill="#a855f7" fill-opacity="0.2" />
  <text x="80" y="281" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#c084fc">4</text>
  <text x="102" y="281" class="font-sans heading" font-size="15" fill="#e9d5ff">"32 Passing Unit Tests"</text>
  <text x="68" y="312" class="font-sans subtext" fill="#d8b4fe">Passes in 12ms. Gives false security.</text>
  <text x="68" y="330" class="font-sans subtext" fill="#cbd5e1"><tspan font-weight="700" fill="#ef4444">CRASHES</tspan> on real telemetry in production.</text>

</svg>
