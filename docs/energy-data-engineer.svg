  <text x="370" y="192" class="font-sans item" font-weight="700" fill="#ffffff">Built-in Energy Plumbing:</text>
  <text x="370" y="214" class="font-sans subtext" font-size="11.5">• <tspan fill="#818cf8" font-weight="600">ODSE Normalization</tspan> Middleware</text>
