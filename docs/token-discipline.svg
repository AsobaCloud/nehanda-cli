<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');
      .font-sans { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .title { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #455bf1; }
      .heading { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .subtext { font-size: 13px; fill: #94a3b8; }
      .mono-code { font-size: 11.5px; fill: #818cf8; font-family: 'JetBrains Mono', monospace; }
    </style>

    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Frame -->
  <rect width="880" height="340" rx="14" fill="#0b0d14" stroke="#22283e" stroke-width="1.5" />

  <!-- Header -->
  <rect x="24" y="20" width="10" height="10" rx="3" fill="#455bf1" />
  <text x="44" y="29" class="font-sans title">CONTEXT ARCHITECTURE &amp; TOKEN DISCIPLINE</text>
  <text x="24" y="58" class="font-sans heading">Architectural Mapping (MAP.md) vs. Wild Grepping</text>
  <line x1="24" y1="74" x2="856" y2="74" stroke="#1c2237" stroke-width="1" />

  <!-- Path A: Wild Grepping (Naive Agent) -->
  <rect x="30" y="95" width="820" height="100" rx="10" fill="#181318" stroke="#3b1d22" stroke-width="1.5" />
  <rect x="45" y="108" width="105" height="22" rx="4" fill="#ef4444" fill-opacity="0.15" />
  <text x="97" y="123" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#f87171">NAIVE AGENT</text>
  <text x="160" y="124" class="font-sans heading" font-size="14" fill="#fca5a5">Wild Grepping &amp; Context Pollution</text>

  <!-- Step A1 -->
  <rect x="45" y="140" width="130" height="40" rx="6" fill="#0b0d14" stroke="#ef4444" stroke-width="1" />
  <text x="110" y="164" text-anchor="middle" class="font-sans" font-size="12" fill="#fca5a5">User Prompt</text>
  <path d="M 175 160 L 220 160" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step A2 -->
  <rect x="225" y="140" width="160" height="40" rx="6" fill="#0b0d14" stroke="#ef4444" stroke-width="1" />
  <text x="305" y="164" text-anchor="middle" class="font-sans" font-size="12" fill="#fca5a5">Grep 50+ Files</text>
  <path d="M 385 160 L 430 160" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step A3 -->
  <rect x="435" y="140" width="180" height="40" rx="6" fill="#0b0d14" stroke="#ef4444" stroke-width="1" />
  <text x="525" y="164" text-anchor="middle" class="font-sans" font-size="12" fill="#fca5a5">120,000 Tokens Flooded</text>
  <path d="M 615 160 L 660 160" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- Step A4 Result -->
  <rect x="665" y="140" width="170" height="40" rx="6" fill="#2d1316" stroke="#ef4444" stroke-width="1.5" />
  <text x="750" y="164" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#fecaca">Dilution &amp; Hallucination</text>

  <!-- Path B: Governed SDLC (Nehanda-CLI) -->
  <rect x="30" y="215" width="820" height="100" rx="10" fill="#101924" stroke="#1b334d" stroke-width="1.5" />
  <rect x="45" y="228" width="105" height="22" rx="4" fill="#455bf1" fill-opacity="0.2" />
  <text x="97" y="243" text-anchor="middle" class="font-sans" font-size="11" font-weight="700" fill="#818cf8">NEHANDA-CLI</text>
  <text x="160" y="244" class="font-sans heading" font-size="14" fill="#93c5fd">Architectural Mapping (70% Token Reduction)</text>

  <!-- Step B1 -->
  <rect x="45" y="260" width="130" height="40" rx="6" fill="#0b0d14" stroke="#455bf1" stroke-width="1" />
  <text x="110" y="284" text-anchor="middle" class="font-sans" font-size="12" fill="#93c5fd">User Prompt</text>
  <path d="M 175 280 L 220 280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step B2 -->
  <rect x="225" y="260" width="160" height="40" rx="6" fill="#0b0d14" stroke="#455bf1" stroke-width="1" />
  <text x="305" y="284" text-anchor="middle" class="font-sans font-mono" font-size="11" fill="#60a5fa">Read docs/MAP.md</text>
  <path d="M 385 280 L 430 280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step B3 -->
  <rect x="435" y="260" width="180" height="40" rx="6" fill="#0b0d14" stroke="#455bf1" stroke-width="1" />
  <text x="525" y="284" text-anchor="middle" class="font-sans" font-size="12" fill="#93c5fd">Targeted Spec (&lt;4k Tokens)</text>
  <path d="M 615 280 L 660 280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />

  <!-- Step B4 Result -->
  <rect x="665" y="260" width="170" height="40" rx="6" fill="#0e2a21" stroke="#10b981" stroke-width="1.5" />
  <text x="750" y="284" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#a7f3d0">Surgical, Zero-Drift Edit</text>

</svg>
