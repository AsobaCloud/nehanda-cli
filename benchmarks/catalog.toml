# benchmarks/catalog.toml
# Unified benchmark suite — single source of truth for datasets, judge, targets, and seeds.
#
# dataset.*.hash is populated by scripts/download-benchmarks.sh after fetch-and-verify.
# judge.model and judge.hash are pinned in PR2 after the calibration study.
# target.*.pin points to per-target runtime pin files.

[suite]
harness_version = "1"
default_seed = 42

# ---------------------------------------------------------------------------
# Judge
# ---------------------------------------------------------------------------
# profile "frontier" uses the operator's configured execute-role model.
# profile "open70b" uses the pinned open-weights GGUF (locked in PR2).
# profile "small" is for fast CI smoke only; results are not canonical.

[judge]
profile = "frontier"
model = ""
hash = ""
majority = 3
seed = 42

