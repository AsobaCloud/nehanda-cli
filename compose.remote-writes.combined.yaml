# Override for compose.combined.yaml that enables data writes over the TCP
# bearer (aimee.api.remote_writes = "data"), so the write→read round-trip
# (scripts/aimee-write-read-e2e.sh) can store a memory and read it back.
#
# The combined image bakes remote_writes:"off" (mutations are local-UDS only by
# default). This mounts a remote-writes-enabled config over the baked one.
#
#   docker compose -f compose.combined.yaml -f compose.remote-writes.combined.yaml up --build
#   WRITE_READ=1 scripts/aimee-combined-docker-smoke.sh
services:
  aimee-server-kb:
    volumes:
      - ./deploy/container/aimee-server-remote-writes.yaml:/var/lib/aimee/aimee.yaml:ro
