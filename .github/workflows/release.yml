name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'aimee.workspace.yaml'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run lint, unit tests, and static analysis on a single runner before
  # kicking off the expensive per-platform release builds.
  pre-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make clang-format-19 cppcheck \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev postgresql-client
      - name: Check formatting
        run: cd src && make lint
      - name: Build integrity
        run: cd src && make build-integrity
      - name: Unit tests
        run: cd src && make -j$(nproc) unit-tests
      - name: Static analysis
        run: cd src && make cppcheck STATIC_ANALYSIS_STRICT=1

  # Linux x86_64: native build and AppImage
  linux-x86_64:
    needs: [pre-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make file fuse libfuse2 librsvg2-bin \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev

      - name: Build binaries
        run: cd src && make -j$(nproc) all

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '#define AIMEE_VERSION' src/headers/aimee.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          cp aimee AppDir/usr/bin/
          cp aimee-webchat AppDir/usr/bin/
          cp aimee-server AppDir/usr/bin/
          cp aimee-kb AppDir/usr/bin/

          cat > AppDir/usr/share/applications/aimee.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=aimee
          Exec=aimee-webchat
          Icon=aimee
          Type=Application
          Categories=Development;
          Comment=AI-powered development assistant
          DESKTOP
          sed -i 's/^          //' AppDir/usr/share/applications/aimee.desktop

          cat > /tmp/aimee_icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="32" fill="#4A90D9"/>
            <text x="128" y="160" font-family="monospace" font-size="120" font-weight="bold" fill="white" text-anchor="middle">A</text>
          </svg>
          SVG
          rsvg-convert /tmp/aimee_icon.svg -o AppDir/usr/share/icons/hicolor/256x256/apps/aimee.png

          ln -sf usr/share/applications/aimee.desktop AppDir/aimee.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/aimee.png AppDir/aimee.png

          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/bash
          SELF_DIR="$(dirname "$(readlink -f "$0")")"
          export PATH="$SELF_DIR/usr/bin:$PATH"
          exec "$SELF_DIR/usr/bin/aimee" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir \
            "aimee-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-x86_64
          path: "aimee-*.AppImage"

  # Linux aarch64: native build on ARM runner
  linux-aarch64:
    needs: [pre-checks]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make file fuse libfuse2 librsvg2-bin wget \
            libsqlite3-dev libcurl4-openssl-dev libpam0g-dev libssl-dev \
            libpq-dev

      - name: Build binaries
        run: cd src && make -j$(nproc) all

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '#define AIMEE_VERSION' src/headers/aimee.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          cp aimee AppDir/usr/bin/
          cp aimee-webchat AppDir/usr/bin/
          cp aimee-server AppDir/usr/bin/
          cp aimee-kb AppDir/usr/bin/

          cat > AppDir/usr/share/applications/aimee.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=aimee
          Exec=aimee-webchat
          Icon=aimee
          Type=Application
          Categories=Development;
          Comment=AI-powered development assistant
          DESKTOP
          sed -i 's/^          //' AppDir/usr/share/applications/aimee.desktop

          cat > /tmp/aimee_icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="32" fill="#4A90D9"/>
            <text x="128" y="160" font-family="monospace" font-size="120" font-weight="bold" fill="white" text-anchor="middle">A</text>
          </svg>
          SVG
          rsvg-convert /tmp/aimee_icon.svg -o AppDir/usr/share/icons/hicolor/256x256/apps/aimee.png

          ln -sf usr/share/applications/aimee.desktop AppDir/aimee.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/aimee.png AppDir/aimee.png

          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/bash
          SELF_DIR="$(dirname "$(readlink -f "$0")")"
          export PATH="$SELF_DIR/usr/bin:$PATH"
          exec "$SELF_DIR/usr/bin/aimee" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=aarch64 ./appimagetool AppDir \
            "aimee-${{ steps.version.outputs.version }}-linux-aarch64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-aarch64
          path: "aimee-*.AppImage"

  # Windows: native build on windows-latest with CMake + NSIS installer
  windows:
    needs: [pre-checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: choco install mingw

      - name: Add MinGW to PATH
        shell: powershell
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download SQLite amalgamation
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\

      - name: Configure with CMake
        run: cmake -B build -G "MinGW Makefiles" -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF

      - name: Build
        run: cmake --build build

      # Cross-platform thin-client smoke (deploy-matrix client axis, P-win).
      # Windows is thin-client-only, so this runs the SELFCHECK mode: it proves
      # the Windows-built client runs and honors the HTTP transport config (a
      # full client<->server round-trip is covered on Linux/macOS).
      - name: Thin-client smoke (Windows client, selfcheck)
        shell: bash
        run: |
          AIMEE_BIN=build/aimee.exe FORCE_MODE=selfcheck \
            bash scripts/aimee-thin-client-smoke.sh

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '#define AIMEE_VERSION' src/headers/aimee.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        run: choco install nsis

      - name: Add NSIS to PATH
        shell: powershell
        run: echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create NSIS installer
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p installer
          cp build/aimee.exe build/aimee-webchat.exe build/aimee-server.exe build/aimee-kb.exe installer/

          cat > installer/aimee-installer.nsi <<'NSI'
          !include "MUI2.nsh"
          Name "aimee"
          OutFile "../aimee-VERSION-windows-x86_64-setup.exe"
          InstallDir "$PROGRAMFILES\aimee"
          RequestExecutionLevel admin
          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Install"
            SetOutPath $INSTDIR
            File "aimee.exe"
            File "aimee-webchat.exe"
            File "aimee-server.exe"
            File "aimee-kb.exe"
            WriteUninstaller "$INSTDIR\uninstall.exe"
            CreateDirectory "$SMPROGRAMS\aimee"
            CreateShortcut "$SMPROGRAMS\aimee\Uninstall.lnk" "$INSTDIR\uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "$INSTDIR\aimee.exe"
            Delete "$INSTDIR\aimee-webchat.exe"
            Delete "$INSTDIR\aimee-server.exe"
            Delete "$INSTDIR\aimee-kb.exe"
            Delete "$INSTDIR\uninstall.exe"
            RMDir "$INSTDIR"
            Delete "$SMPROGRAMS\aimee\Uninstall.lnk"
            RMDir "$SMPROGRAMS\aimee"
          SectionEnd
          NSI

          # Strip heredoc indentation and substitute version
          sed -i 's/^          //' installer/aimee-installer.nsi
          sed -i "s/VERSION/${VERSION}/g" installer/aimee-installer.nsi

          cd installer
          makensis aimee-installer.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: "aimee-*-setup.exe"

  # macOS: build native ARM binary and create .tar.gz
  macos-arm:
    needs: [pre-checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sqlite curl openssl@3 libpq

      - name: Build binaries
        run: |
          cd src
          make -j$(sysctl -n hw.ncpu) all server \
            EXTRA_C_FLAGS="-I$(brew --prefix sqlite)/include -I$(brew --prefix openssl@3)/include -I$(brew --prefix libpq)/include" \
            EXTRA_L_FLAGS="-L$(brew --prefix sqlite)/lib -L$(brew --prefix openssl@3)/lib -L$(brew --prefix libpq)/lib"

      - name: Verify binaries
        run: |
          ./aimee version
          ./aimee-webchat --help
          ./aimee-server --version
          ./aimee-kb --version
          file aimee aimee-webchat aimee-server aimee-kb

      # Cross-platform thin-client smoke (deploy-matrix client axis, P-mac):
      # start a local standalone aimee-server (DB1/SQLite, no kb) and drive it
      # with the macOS-built `aimee` client over the HTTP transport. The smoke
      # auto-degrades to a transport-config selfcheck if the server doesn't bind.
      - name: Thin-client smoke (macOS client -> local server)
        shell: bash
        run: |
          export AIMEE_HOME="$RUNNER_TEMP/aimee-e2e"
          mkdir -p "$AIMEE_HOME"
          sed 's/aimee-local-dev/ci-smoke-token/' deploy/container/aimee-server.yaml > "$AIMEE_HOME/aimee.yaml"
          export AIMEE_SERVER_HTTP_BIND=1
          export AIMEE_DB1_URL="sqlite://$AIMEE_HOME/aimee.db"
          ulimit -s 65536 || true
          ./aimee-server --socket="$AIMEE_HOME/srv.sock" & SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          AIMEE_BIN=./aimee BEARER=ci-smoke-token SERVER_URL=http://127.0.0.1:8740 \
            bash scripts/aimee-thin-client-smoke.sh

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '#define AIMEE_VERSION' src/headers/aimee.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package macOS distribution
        run: |
          DIST_DIR="aimee-${{ steps.version.outputs.version }}-macos-arm64"
          mkdir -p "$DIST_DIR"
          cp aimee aimee-webchat aimee-server aimee-kb "$DIST_DIR/"
          cp install.sh distro-detect.sh configure-hooks.sh "$DIST_DIR/" 2>/dev/null || true
          cp README.md LICENSE "$DIST_DIR/" 2>/dev/null || true
          tar czf "${DIST_DIR}.tar.gz" "$DIST_DIR"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: "aimee-*-macos-arm64.tar.gz"

  # Docker: native amd64 build → ghcr.io intermediate tag
  docker-amd64:
    needs: [pre-checks]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/amd64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/aimee-kb:build-${{ github.run_id }}-amd64

  # Docker: native arm64 build → ghcr.io intermediate tag
  docker-arm64:
    needs: [pre-checks]
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/arm64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/aimee-kb:build-${{ github.run_id }}-arm64

  # Docker: merge arch images into a multi-arch manifest
  docker-manifest:
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '#define AIMEE_VERSION' src/headers/aimee.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ steps.version.outputs.owner }}/aimee-kb"
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"
          INTERMEDIATE="ghcr.io/${{ github.repository_owner }}/aimee-kb"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${VERSION}-${SHORT_SHA}" \
            -t "${IMAGE}:latest" \
            "${INTERMEDIATE}:build-${{ github.run_id }}-amd64" \
            "${INTERMEDIATE}:build-${{ github.run_id }}-arm64"

  # Create GitHub Release with all artifacts
  release:
    needs: [linux-x86_64, linux-aarch64, windows, macos-arm, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '#define AIMEE_VERSION' src/headers/aimee.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          name: aimee v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `aimee-${{ steps.version.outputs.version }}-linux-x86_64.AppImage` |
            | Linux aarch64 | `aimee-${{ steps.version.outputs.version }}-linux-aarch64.AppImage` |
            | Windows x86_64 | `aimee-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe` |
            | macOS ARM | `aimee-${{ steps.version.outputs.version }}-macos-arm64.tar.gz` |
            | Docker (linux/amd64, linux/arm64) | `ghcr.io/jbailes/aimee-kb:${{ steps.version.outputs.version }}` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
