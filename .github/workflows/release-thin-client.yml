# Release pipeline for the aimee thin client (the `aimee` CLI).
#
# Produces a size-lean `aimee` binary for Linux, macOS, and Windows and attaches
# them to a GitHub release on tag push (v*). Only the thin client is shipped;
# aimee-server / aimee-kb / aimee-gateway are Linux/Docker components released
# separately. The client reaches a server over the local Unix socket (POSIX) or
# a remote TCP endpoint (AIMEE_SERVER_URL / --server); see the thin-client
# cross-platform proposal.
name: release-thin-client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: aimee-linux-x86_64
          - os: macos-latest
            asset: aimee-macos-arm64
          - os: windows-latest
            asset: aimee-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # --- Linux: authoritative make build of the lean thin client ---
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc make libsqlite3-dev
      - name: Build (Linux, make)
        if: matrix.os == 'ubuntu-latest'
        run: cd src && make -j"$(nproc)" ../aimee
      - name: Stage artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp aimee "${{ matrix.asset }}"

      # --- macOS: CMake thin-client target, lean profile ---
      - name: macOS deps
        if: matrix.os == 'macos-latest'
        run: brew install sqlite3 openssl@3 || true
      - name: Build (macOS, CMake)
        if: matrix.os == 'macos-latest'
        run: |
          cmake -B build -DAIMEE_THIN_CLIENT=ON -DAIMEE_LEAN=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --parallel 3 --target aimee
      - name: Stage artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: cp build/aimee "${{ matrix.asset }}"

      # --- Windows: CMake thin-client target via MinGW, lean profile ---
      - name: Install MinGW-w64 (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install mingw
      - name: Add MinGW to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download SQLite amalgamation (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite-tmp
          New-Item -ItemType Directory -Force -Path src\vendor\sqlite3
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.c src\vendor\sqlite3\
          Copy-Item sqlite-tmp\sqlite-amalgamation-3470200\sqlite3.h src\vendor\sqlite3\
      - name: Build (Windows, CMake)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -B build -G "MinGW Makefiles" -DAIMEE_THIN_CLIENT=ON -DAIMEE_LEAN=ON -DWITH_PAM=OFF -DWITH_LIBSECRET=OFF -DWITH_UI=OFF -DWITH_TLS=OFF
          cmake --build build --parallel 2 --target aimee
      - name: Stage artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: Copy-Item build\aimee.exe "${{ matrix.asset }}"

      - name: Smoke test artifact (POSIX)
        if: matrix.os != 'windows-latest'
        run: ./${{ matrix.asset }} version
      - name: Smoke test artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\${{ matrix.asset }} version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
